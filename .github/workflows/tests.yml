name: tests
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "marketing/**", "**.md"]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
        adk: [""]
        include:
          - {python: "3.12", adk: "==2.0.0"}
          - {python: "3.12", adk: "==1.7.0"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install . pytest "google-adk${{ matrix.adk }}"
      - run: pytest -q
